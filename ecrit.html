<!doctype html>
<html lang="fr">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier de Production Écrite Académique</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&amp;family=Lato:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2c3e50;
      --accent: #e74c3c;
      --success: #27ae60;
      --warning: #f39c12;
      --bg: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 100%);
      --card-bg: #ffffff;
      --border: #d5d8dc;
      --text-primary: #2c3e50;
      --text-secondary: #7f8c8d;
    }
    html { height: 100%; }
    body { 
      font-family: 'Lato', sans-serif; 
      background: var(--bg);
      color: var(--text-primary); 
      height: 100%;
      overflow: hidden;
    }
    .navbar {
      background: var(--primary);
      padding: 20px 30px;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid var(--accent);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .navbar-brand {
      font-weight: 700;
      color: #ffffff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Merriweather', serif;
    }
    .navbar-brand i { color: var(--accent); font-size: 1.8rem; }
    .navbar-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .btn-reset {
      background: var(--warning);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-reset:hover {
      background: #e67e22;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
    }
    .main-wrapper {
      width: 100%;
      height: calc(100% - 80px);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }
    .home-view {
      flex: 1;
      overflow-y: auto;
      padding: 40px 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      background: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 100%);
      display: none;
    }
    .home-view.active { display: block; }
    .hero {
      text-align: center;
      padding: 50px 40px;
      background: linear-gradient(135deg, rgba(44, 62, 80, 0.05) 0%, rgba(231, 76, 60, 0.08) 100%);
      border-radius: 12px;
      margin-bottom: 50px;
      border: 2px solid var(--accent);
    }
    .hero h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.8rem;
      color: var(--primary);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero p {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 25px;
      line-height: 1.8;
    }
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-bottom: 50px;
      width: 100%;
    }
    .module-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .module-card:hover {
      border-color: var(--accent);
      transform: translateY(-8px);
      box-shadow: 0 12px 28px rgba(231, 76, 60, 0.15);
    }
    .module-icon { font-size: 2.5rem; margin-bottom: 15px; display: inline-block; }
    .module-number {
      display: inline-block;
      background: var(--accent);
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }
    .module-title {
      font-family: 'Merriweather', serif;
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 12px;
      font-weight: 700;
    }
    .module-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 15px;
    }
    .module-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .lesson-view {
      display: none;
      flex: 1;
      overflow: hidden;
      background: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 100%);
    }
    .lesson-view.active {
      display: flex;
      flex-direction: row;
      height: 100%;
    }
    .lesson-sidebar-nav {
      width: 280px;
      background: var(--card-bg);
      border-right: 2px solid var(--border);
      overflow: hidden;
      padding: 0;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-header {
      padding: 20px;
      background: var(--primary);
      color: white;
      border-bottom: 2px solid var(--accent);
      flex-shrink: 0;
    }
    .sidebar-header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Merriweather', serif;
    }
    .sidebar-nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .sidebar-nav-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      background: rgba(44, 62, 80, 0.05);
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-nav-item:hover {
      background: rgba(44, 62, 80, 0.08);
      border-color: var(--accent);
      transform: translateX(3px);
    }
    .sidebar-nav-item.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .sidebar-nav-item span { flex: 1; }
    .lesson-container {
      flex: 1;
      margin: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 30px;
      height: 100%;
      overflow-y: auto;
    }
    .lesson-main {
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .btn-back {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
    }
    .btn-back:hover { background: var(--accent); color: white; }
    .lesson-step {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .step-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Merriweather', serif;
    }
    .step-icon { font-size: 1.8rem; }
    .toolbox-section {
      background: rgba(44, 62, 80, 0.08);
      border-left: 4px solid var(--accent);
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 6px;
    }
    .toolbox-section-name {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .toolbox-item {
      padding: 8px 0;
      font-size: 0.9rem;
      color: var(--text-primary);
      line-height: 1.6;
      border-bottom: 1px solid rgba(44, 62, 80, 0.1);
    }
    .toolbox-item:last-child { border-bottom: none; }
    .concept-box {
      background: linear-gradient(135deg, rgba(44, 62, 80, 0.05), rgba(231, 76, 60, 0.05));
      padding: 22px;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--text-primary);
      margin-bottom: 25px;
    }
    .example-box {
      background: rgba(24, 119, 242, 0.08);
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
      margin-bottom: 20px;
    }
    .example-title {
      margin-bottom: 12px;
      color: var(--primary);
      font-weight: 700;
    }
    .example-text {
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--text-primary);
      font-style: italic;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .exercise-box {
      background: rgba(44, 62, 80, 0.02);
      padding: 18px;
      border-radius: 8px;
      border-left: 3px solid var(--success);
      margin-bottom: 15px;
    }
    .exercise-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .exercise-criteria {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .redaction-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .word-counter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    .word-counter-label { color: var(--text-secondary); }
    .word-counter-value { font-weight: 700; color: var(--accent); }
    textarea {
      width: 100%;
      min-height: 280px;
      padding: 15px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-family: 'Lato', sans-serif;
      font-size: 0.95rem;
      resize: vertical;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
    }
    .button-group {
      display: flex;
      gap: 12px;
    }
    .btn-save, .btn-clear {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }
    .btn-save {
      background: var(--accent);
      color: white;
    }
    .btn-save:hover {
      background: #c0392b;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
    }
    .btn-clear {
      background: var(--warning);
      color: white;
    }
    .btn-clear:hover {
      background: #e67e22;
      transform: translateY(-2px);
    }
    .feedback {
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }
    .feedback.success {
      background: rgba(39, 174, 96, 0.1);
      color: var(--success);
      border-left: 3px solid var(--success);
      display: block;
    }
    .feedback.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-left: 3px solid #ef4444;
      display: block;
    }
    @media (max-width: 1024px) {
      .lesson-view { flex-direction: column; }
      .lesson-sidebar-nav {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid var(--border);
        height: auto;
      }
      .sidebar-nav-list {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 10px;
      }
      .sidebar-nav-item { flex-shrink: 0; min-width: 150px; }
    }
    @media (max-width: 768px) {
      .hero h1 { font-size: 1.8rem; }
      .modules-grid { grid-template-columns: 1fr; }
      .navbar { flex-direction: column; gap: 15px; }
      .navbar-brand { width: 100%; justify-content: center; }
      .navbar-actions { width: 100%; justify-content: center; }
    }
  </style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body>
  <nav class="navbar">
   <div class="navbar-brand">
    <i class="fas fa-pen-fancy"></i> ATELIER ACADÉMIQUE
   </div>
   <div class="navbar-actions"><span id="totalScore" style="color: white; font-weight: 700; font-size: 1.1rem;">0 textes</span> <button class="btn-reset" onclick="resetAll()"><i class="fas fa-refresh"></i> Réinitialiser</button>
   </div>
  </nav>
  <div class="main-wrapper">
   <div id="homeView" class="home-view active">
    <div class="hero">
     <h1 id="heroTitle">📚 Atelier de Production Écrite Académique</h1>
     <p id="heroSubtitle">10 activités avec boîtes à outils, observations détaillées et retours structurés</p>
    </div>
    <div class="modules-grid" id="modulesGrid"></div>
   </div>
   <div id="lessonView" class="lesson-view">
    <div class="lesson-sidebar-nav">
     <div class="sidebar-header">
      <h2 id="sidebarModuleTitle">Sections</h2>
     </div>
     <div class="sidebar-nav-list" id="sidebarNavList"></div>
    </div>
    <div class="lesson-container">
     <div class="lesson-main"><button class="btn-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Retour accueil</button>
      <div id="lessonContent"></div>
     </div>
    </div>
   </div>
  </div>
  <script>
    let currentModule = null;
    let allTexts = [];

    const modules = [
      {
        id: 1,
        title: "Description d'un lieu",
        description: "Maîtriser la description sensorielle pour immerger le lecteur",
        icon: "🏞️",
        context: `La description littéraire d'un lieu est bien plus qu'une énumération. Elle doit créer une atmosphère, une ambiance, en engageant les sens du lecteur. Une description efficace combine l'observation visuelle précise avec les émotions qu'elle suscite. Elle ordonne l'espace de manière cohérente (du général au particulier, du proche au lointain) et utilise un vocabulaire spécifique pour qualifier les objets et les sensations. La description doit aussi révéler l'état émotionnel du personnage qui observe : un même lieu peut paraître hostile ou accueillant selon le regard porté sur lui. C'est pourquoi la subjectivité du narrateur teinte toujours la description, même lorsqu'elle prétend à l'objectivité.`,
        
        toolbox: {
          sections: [
            {
              name: "📋 Structure recommandée",
              items: [
                "1. Vue d'ensemble : situation générale du lieu",
                "2. Ambiance générale : lumière, température, son ambiant",
                "3. Détails progressifs : des éléments généraux aux objets particuliers",
                "4. Impact émotionnel : ce que ce lieu inspire au narrateur",
                "5. Conclusion : une impression finale, une sensation mémorante"
              ]
            },
            {
              name: "🎨 Techniques descriptives",
              items: [
                "Énumération : lister des éléments similaires",
                "Comparaison/Métaphore : 'comme du marbre poli' ou 'un paradis perdu'",
                "Énumération sensorielle : citer explicitement un sens",
                "Procédés de mise en relief : répétitions, gradations"
              ]
            },
            {
              name: "🌈 Vocabulaire spécifique",
              items: [
                "Couleurs : écarlate, vermeil, azuré, ambre, ocre, cramoisi",
                "Textures : rêche, lisse, velouté, rugueux, poli, soyeux",
                "Lumière : éclatante, diffuse, tamisée, crépusculaire",
                "Sons : susurrement, murmure, bourdonnement, retentissement"
              ]
            }
          ]
        },

        wordTarget: 250,
        example: `La gare centrale de Milan m'accueillit dans un tumulte de sons et de lumières. Le dôme de verre filtrait une lumière bleutée, presque irréelle, qui se projetait sur les milliers de voyageurs qui s'entrelançaient. L'air était saturé d'odeurs hétéroclites : parfum bon marché, café amer, essence de diesel. Sous la voûte monumentale, résonnait un brouhaha incessant de voix superposées, de trainées de valises, de coups de sifflet. Les colonnes de marbre rose, sculptées avec une finesse oubliée, contrastaient violemment avec la modernité frénétique du lieu. Je sentais mon cœur s'accélérer, oppressé par cette ambiance chaotique et civilisée à la fois. Les bancs de bois verni, polis par des milliers de mains, respiraient une certaine mélancolie, comme si chaque voyageur y avait laissé un fragment de son histoire. Cette gare n'était pas un simple passage : c'était un temple de la transition.`,
        
        exercices: [
          { 
            title: "Description d'une salle de classe historique", 
            criteria: "Au moins 5 sens • Organisation spatiale claire • Minimum 300 mots"
          },
          { 
            title: "Description d'un marché en activité", 
            criteria: "Énumération progressive • Au moins 3 comparaisons • Ambiance vivante"
          }
        ]
      },

      {
        id: 2,
        title: "Récit autobiographique",
        description: "Maîtriser la narration personnelle avec authenticité",
        icon: "💭",
        context: `Le récit autobiographique est un exercice d'introspection et de reconstruction. Il ne s'agit pas simplement de rapporter des faits, mais de les interpréter, de les donner du sens. L'autobiographe raconte sa propre vie, mais avec du recul, de l'analyse. Il faut distinguer le narrateur actuel (celui qui écrit) du protagoniste passé (celui qui a vécu l'événement). Cette distance permet une certaine lucidité. Le récit autobiographique doit aussi respecter la chronologie tout en créant du suspense. Il combine description du contexte historique et personnel, introspection émotionnelle, et réflexion sur ce que cet événement a changé.`,
        
        toolbox: {
          sections: [
            {
              name: "📋 Structure narrative",
              items: [
                "1. Ouverture : planter le décor (époque, lieu, circonstances)",
                "2. Contexte personnel : qui j'étais à ce moment",
                "3. Événement : le fait ou la série de faits au cœur du récit",
                "4. Réactions et émotions : ce que j'ai ressenti et découvert",
                "5. Conséquences : comment cet événement m'a transformé",
                "6. Réflexion actuelle : ce que j'en pense aujourd'hui"
              ]
            },
            {
              name: "💬 Techniques du récit personnel",
              items: [
                "Dialogues authentiques : retranscrire les paroles telles qu'on s'en souvient",
                "Détails sensoriels précis : une odeur, une texture qui rend vivant",
                "Ton confessionnel : utilisation du 'je' pour l'intimité",
                "Contraste passé/présent : montrer l'évolution de la perspective"
              ]
            },
            {
              name: "🔍 Critères d'authenticité",
              items: [
                "Honnêteté : accepter ses erreurs, ses faiblesses, ses regrets",
                "Vraisemblance : les détails doivent sonner justes",
                "Émotion contenue : éviter l'excès de lyrisme",
                "Respect de la mémoire : ne pas réinventer complètement"
              ]
            }
          ]
        },

        wordTarget: 280,
        example: `Je me souviens de cet été 2005 avec une clarté presque douloureuse. J'avais treize ans, cet âge où l'on commence à sentir qu'on n'est plus un enfant, mais pas encore un adulte. Mes grands-parents m'avaient invité à passer deux semaines dans leur maison de campagne, une vieille ferme en Provence entourée de vignes. Mon grand-père, agriculteur depuis soixante ans, m'a proposé de travailler avec lui dans les champs. J'ai accepté sans enthousiasme débordant, imaginant que ce serait ennuyeux. Le premier matin, je me suis réveillé à l'aube. L'air était frais, le ciel d'un rose pâle. Mon grand-père m'a montré comment cueillir les raisins sans abîmer la grappe. Ses mains, usées et calleuses, bougeaient avec une précision que je n'aurais jamais crue possible. 'C'est comme caresser quelque chose d'important', disait-il. À midi, allongés sous un acacia, nous avons mangé du pain, du fromage et des olives. Mon grand-père m'a raconté sa vie : les guerres, les amours, les moissons perdues. Je l'écoutais, fasciné. Ce moment simple m'a reconcilié avec l'idée du travail manuel.`,
        
        exercices: [
          { 
            title: "Premier jour dans un nouveau lieu", 
            criteria: "Minimum 300 mots • Contexte spatio-temporel • Au moins 2 dialogues"
          },
          { 
            title: "Un moment de découverte personnel", 
            criteria: "Introspection authentique • Détails sensoriels • Avant/après mentalement"
          }
        ]
      },

      {
        id: 3,
        title: "Portrait psychologique",
        description: "Caractériser une personne en profondeur",
        icon: "👤",
        context: `Le portrait n'est jamais neutre : c'est toujours un acte d'interprétation. Le portraitiste doit combiner l'observation physique minutieuse avec une compréhension psychologique. Un véritable portrait va au-delà des apparences. Il révèle les contradictions, les tensions internes, les masques que nous portons. Le portrait doit montrer comment le physique et le moral s'entrelacent : une gestuelle révèle un trait de caractère, une expression des yeux trahit une souffrance cachée. Le bon portrait laisse entendre ce qui n'est pas dit. Il utilise l'ironie, la nuance, l'ambiguïté.`,
        
        toolbox: {
          sections: [
            {
              name: "📋 Éléments du portrait",
              items: [
                "1. Silhouette générale : taille, corpulence, port de tête",
                "2. Visage : traits caractéristiques, expression habituelle",
                "3. Regard : la fenêtre de l'âme, révèle l'intelligence, la sensibilité",
                "4. Vêtements : reflet des valeurs, de la personnalité",
                "5. Gestes et mouvements : démarche, façon de parler",
                "6. Traits de caractère : révélés par des actions ou des exemples",
                "7. Contradictions internes : tensions qui rendent vivante"
              ]
            },
            {
              name: "🎭 Techniques portraituristiques",

                "Anaphore : répétition du mot au début",
                "Énumération poétique : lister des images",
                "Paradoxe : 'le silence bruyant'"
              ]
            },
            {
              name: "🌙 Techniques de composition",
              items: [
                "Sauts de ligne : créent rythme et suspense",
                "Strophe irégulière : vers de longueur variable",
                "Absence de ponctuation : crée fluidité",
                "Enjambement : sens se poursuit sur ligne suivante",
                "Vers blanc : pas de rime, juste rythme interne"
              ]
            }
          ]
        },

        wordTarget: 120,
        example: `La pluie tombe
sur les tuiles grises.
Doucement, doucement,
comme les larmes d'une mère
qui ne veut pas déranger.

Moi aussi je tombe
en silence.
Mon cœur s'émiette
en millions de gouttes.
Personne ne l'entend.

Mais demain,
les fleurs se relèveront.
Elles boiront ma tristesse
et y transformeront en couleur.

Peut-être que moi aussi,
je serai fleuri.`,
        
        exercices: [
          { 
            title: "Poème sur un sentiment complexe", 
            criteria: "Au moins 100 mots • Au moins 2 figures • Images concrètes"
          },
          { 
            title: "Poème narratif ou paysage", 
            criteria: "Histoire/scène • Musicalité • Charge émotionnelle"
          }
        ]
      }
    ];

    const dataHandler = {
      onDataChanged(data) {
        allTexts = data;
        updateTextCount();
      }
    };

    async function initData() {
      const result = await window.dataSdk.init(dataHandler);
      if (!result.isOk) console.error("SDK init failed");
    }

    function init() {
      renderHome();
      initData();
    }

    function renderHome() {
      document.getElementById('homeView').classList.add('active');
      document.getElementById('lessonView').classList.remove('active');
      const grid = document.getElementById('modulesGrid');
      grid.innerHTML = modules.map(m => `
        <div class="module-card" onclick="selectModule(${m.id})">
          <div class="module-icon">${m.icon}</div>
          <div class="module-number">${m.id}</div>
          <div class="module-title">${m.title}</div>
          <div class="module-desc">${m.description}</div>
          <div class="module-meta">
            <span><i class="fas fa-book"></i> Théorie & Outils</span>
            <span><i class="fas fa-pen"></i> Rédaction</span>
          </div>
        </div>
      `).join('');
    }

    function selectModule(id) {
      currentModule = modules.find(m => m.id === id);
      renderLesson();
    }

    function renderLesson() {
      document.getElementById('homeView').classList.remove('active');
      document.getElementById('lessonView').classList.add('active');

      const sidebarList = document.getElementById('sidebarNavList');
      const sections = [
        { id: 'observation', label: 'Observation', icon: '📖' },
        { id: 'boite-outils', label: 'Boîte à outils', icon: '🔧' },
        { id: 'redaction', label: 'Rédaction', icon: '✏️' }
      ];

      sidebarList.innerHTML = sections.map(sec => `
        <div class="sidebar-nav-item" onclick="showSection('${sec.id}')">
          <span>${sec.icon}</span>
          <span>${sec.label}</span>
        </div>
      `).join('');

      document.getElementById('sidebarModuleTitle').textContent = currentModule.title;
      showSection('observation');
    }

    function showSection(sectionId) {
      const m = currentModule;
      const content = document.getElementById('lessonContent');

      if (sectionId === 'observation') {
        content.innerHTML = `
          <div class="lesson-step">
            <div class="step-title">
              <div class="step-icon">📖</div>
              Observation Académique
            </div>
            <div class="concept-box">${m.context}</div>
            <div class="example-box">
              <div class="example-title">📌 Exemple détaillé :</div>
              <div class="example-text">${m.example}</div>
            </div>
            <div style="background: rgba(39, 174, 96, 0.08); padding: 18px; border-radius: 8px; border-left: 4px solid var(--success); margin-bottom: 20px;">
              <span style="color: var(--success); font-weight: 700;">🎯 Objectif de mots :</span>
              <span style="color: var(--text-primary); margin-left: 8px; font-weight: 600;">Minimum ${m.wordTarget} mots</span>
            </div>
            <div style="margin-top: 25px; padding-top: 20px; border-top: 2px solid var(--border);">
              <h4 style="margin-bottom: 15px; color: var(--primary); font-weight: 700;">💪 Travaux pratiques :</h4>
              ${m.exercices.map((ex, idx) => `
                <div class="exercise-box">
                  <div class="exercise-title">Exercice ${idx + 1} : ${ex.title}</div>
                  <div class="exercise-criteria">✓ Critères : ${ex.criteria}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (sectionId === 'boite-outils') {
        content.innerHTML = `
          <div class="lesson-step">
            <div class="step-title">
              <div class="step-icon">🔧</div>
              Boîte à outils complète
            </div>
            ${m.toolbox.sections.map(section => `
              <div class="toolbox-section">
                <div class="toolbox-section-name">${section.name}</div>
                ${section.items.map(item => `
                  <div class="toolbox-item">→ ${item}</div>
                `).join('')}
              </div>
            `).join('')}
          </div>
        `;
      } else if (sectionId === 'redaction') {
        content.innerHTML = `
          <div class="lesson-step">
            <div class="step-title">
              <div class="step-icon">✏️</div>
              Espace de rédaction
            </div>
            <div class="redaction-container">
              <div class="word-counter">
                <span class="word-counter-label">Avancement :</span>
                <span><span id="wordCount">0</span> / ${m.wordTarget} mots</span>
              </div>
              <textarea id="redactionText" 
                placeholder="Commencez votre rédaction ici. Vous avez tout l'espace qu'il faut. N'oubliez pas : qualité plutôt que quantité. Minimum ${m.wordTarget} mots."
                onkeyup="updateWordCount(${m.wordTarget})"></textarea>
              <div class="button-group">
                <button class="btn-save" onclick="saveRedaction()">
                  <i class="fas fa-save"></i> Enregistrer
                </button>
                <button class="btn-clear" onclick="clearRedaction()">
                  <i class="fas fa-refresh"></i> Recommencer
                </button>
              </div>
              <div id="feedbackRedaction" class="feedback"></div>
            </div>
          </div>
        `;
        const saved = localStorage.getItem('redaction_' + m.id);
        if (saved) {
          document.getElementById('redactionText').value = saved;
          updateWordCount(m.wordTarget);
        }
      }
    }

    function updateWordCount(target) {
      const textarea = document.getElementById('redactionText');
      if (!textarea) return;
      const text = textarea.value.trim();
      const words = text.length > 0 ? text.split(/\s+/).length : 0;
      document.getElementById('wordCount').textContent = words;

      if (words >= target) {
        document.getElementById('wordCount').parentElement.style.color = 'var(--success)';
      } else if (words >= target * 0.8) {
        document.getElementById('wordCount').parentElement.style.color = 'var(--accent)';
      }
    }

    async function saveRedaction() {
      const textarea = document.getElementById('redactionText');
      const text = textarea.value.trim();
      
      if (text.length === 0) {
        showFeedback('Veuillez écrire quelque chose avant de sauvegarder.', 'error');
        return;
      }

      const words = text.split(/\s+/).length;
      localStorage.setItem('redaction_' + currentModule.id, text);

      const record = {
        id: 'text_' + currentModule.id + '_' + Date.now(),
        module_id: currentModule.id,
        text: text,
        word_count: words,
        created_at: new Date().toISOString(),
        evaluation: ''
      };

      const result = await window.dataSdk.create(record);
      if (result.isOk) {
        showFeedback('✓ Votre rédaction a été enregistrée avec succès !', 'success');
      } else {
        showFeedback('Erreur lors de l\'enregistrement.', 'error');
      }
    }

    function showFeedback(msg, type) {
      const fb = document.getElementById('feedbackRedaction');
      fb.className = 'feedback ' + type;
      fb.innerHTML = msg;
      setTimeout(() => { fb.className = 'feedback'; }, 4000);
    }

    function clearRedaction() {
      const textarea = document.getElementById('redactionText');
      textarea.value = '';
      localStorage.removeItem('redaction_' + currentModule.id);
      updateWordCount(currentModule.wordTarget);
      showFeedback('Rédaction effacée', 'error');
    }

    function updateTextCount() {
      document.getElementById('totalScore').textContent = allTexts.length + ' textes';
    }

    function goHome() {
      currentModule = null;
      renderHome();
    }

    function resetAll() {
      localStorage.clear();
      location.reload();
    }

    init();
  </script>
