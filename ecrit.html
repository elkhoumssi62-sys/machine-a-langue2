<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier de Production Écrite Académique</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&amp;family=Lato:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2c3e50;
      --accent: #e74c3c;
      --success: #27ae60;
      --warning: #f39c12;
      --bg: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 100%);
      --card-bg: #ffffff;
      --border: #d5d8dc;
      --text-primary: #2c3e50;
      --text-secondary: #7f8c8d;
    }
    
    html, body { 
      min-height: 100%; 
      width: 100%;
    }

    body { 
      font-family: 'Lato', sans-serif; 
      background: var(--bg);
      color: var(--text-primary); 
      /* CORRECTION : On autorise le défilement vertical pour mobile */
      overflow-y: auto;
      overflow-x: hidden;
    }

    .navbar {
      background: var(--primary);
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid var(--accent);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-weight: 700;
      color: #ffffff;
      font-size: clamp(1rem, 4vw, 1.5rem);
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Merriweather', serif;
    }

    .navbar-brand i { color: var(--accent); font-size: 1.5rem; }

    .navbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-reset {
      background: var(--warning);
      border: none;
      color: white;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .home-view {
      flex: 1;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: none;
    }
    .home-view.active { display: block; }

    .hero {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 100%);
      border-radius: 12px;
      margin-bottom: 30px;
      border: 2px solid var(--accent);
    }

    .hero h1 {
      font-family: 'Merriweather', serif;
      font-size: clamp(1.5rem, 6vw, 2.8rem);
      color: var(--primary);
      margin-bottom: 15px;
      text-transform: uppercase;
      word-wrap: break-word;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .module-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .module-card:hover { border-color: var(--accent); transform: translateY(-5px); }

    .lesson-view {
      display: none;
      flex: 1;
      width: 100%;
    }

    .lesson-view.active {
      display: flex;
      flex-direction: column;
    }

    /* Sidebar adaptée pour Mobile */
    .lesson-sidebar-nav {
      width: 100%;
      background: var(--card-bg);
      border-bottom: 2px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-nav-list {
      display: flex;
      overflow-x: auto;
      padding: 10px;
      gap: 10px;
    }

    .sidebar-nav-item {
      padding: 10px 15px;
      background: rgba(44, 62, 80, 0.05);
      border-radius: 8px;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    /* Mise en page Desktop */
    @media (min-width: 1025px) {
      .lesson-view.active { flex-direction: row; }
      .lesson-sidebar-nav { width: 280px; border-right: 2px solid var(--border); border-bottom: none; height: calc(100vh - 70px); position: sticky; top: 70px; }
      .sidebar-nav-list { flex-direction: column; overflow-x: hidden; }
    }

    .lesson-container {
      flex: 1;
      padding: 20px;
      width: 100%;
    }

    textarea {
      width: 100%;
      min-height: 250px;
      padding: 15px;
      font-size: 16px; /* Empêche le zoom auto sur mobile */
      border: 2px solid var(--border);
      border-radius: 8px;
    }

    /* Le reste de vos styles conservés sans changement de contenu */
    .module-icon { font-size: 2.5rem; margin-bottom: 15px; display: inline-block; }
    .module-number { display: inline-flex; background: var(--accent); color: white; width: 35px; height: 35px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 700; margin-bottom: 12px; }
    .module-title { font-family: 'Merriweather', serif; font-size: 1.4rem; color: var(--primary); margin-bottom: 12px; }
    .module-desc { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 15px; }
    .module-meta { display: flex; gap: 12px; font-size: 0.85rem; color: var(--text-secondary); padding-top: 12px; border-top: 1px solid var(--border); }
    .sidebar-header { padding: 15px; background: var(--primary); color: white; }
    .sidebar-nav-item.active { background: var(--accent); color: white; }
    .btn-back { background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 10px 18px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
    .lesson-step { background: var(--card-bg); border: 2px solid var(--border); border-radius: 10px; padding: 20px; }
    .concept-box { background: rgba(44, 62, 80, 0.05); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); margin-bottom: 20px; }
    .example-box { background: rgba(24, 119, 242, 0.05); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); margin-bottom: 20px; }
    .toolbox-section { background: rgba(44, 62, 80, 0.05); border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 15px; border-radius: 6px; }
    .button-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .btn-save, .btn-clear { flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: white; }
    .btn-save { background: var(--accent); }
    .btn-clear { background: var(--warning); }
    .feedback { padding: 12px; margin-top: 10px; border-radius: 6px; display: none; }
    .feedback.success { background: rgba(39, 174, 96, 0.1); color: var(--success); display: block; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand"><i class="fas fa-pen-fancy"></i> ATELIER ACADÉMIQUE</div>
    <div class="navbar-actions">
      <span id="totalScore" style="color: white; font-weight: 700;">0 textes</span>
      <button class="btn-reset" onclick="resetAll()"><i class="fas fa-refresh"></i></button>
    </div>
  </nav>

  <div class="main-wrapper">
    <div id="homeView" class="home-view active">
      <div class="hero">
        <h1 id="heroTitle">📚 Atelier de Production Écrite</h1>
        <p id="heroSubtitle">10 activités avec boîtes à outils et retours structurés</p>
      </div>
      <div class="modules-grid" id="modulesGrid"></div>
    </div>

    <div id="lessonView" class="lesson-view">
      <div class="lesson-sidebar-nav">
        <div class="sidebar-header"><h2 id="sidebarModuleTitle" style="font-size: 1rem;">Sections</h2></div>
        <div class="sidebar-nav-list" id="sidebarNavList"></div>
      </div>
      <div class="lesson-container">
        <div class="lesson-main">
          <button class="btn-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Accueil</button>
          <div id="lessonContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // VOTRE LOGIQUE JAVASCRIPT RESTE EXACTEMENT LA MÊME
    let currentModule = null;
    let allTexts = [];

    const modules = [
      {
        id: 1,
        title: "Description d'un lieu",
        description: "Maîtriser la description sensorielle pour immerger le lecteur",
        icon: "🏞️",
        context: `La description littéraire d'un lieu est bien plus qu'une énumération. Elle doit créer une atmosphère...`,
        toolbox: {
          sections: [
            { name: "📋 Structure recommandée", items: ["1. Vue d'ensemble", "2. Ambiance", "3. Détails", "4. Émotion"] }
          ]
        },
        wordTarget: 250,
        example: `La gare centrale de Milan m'accueillit dans un tumulte...`,
        exercices: [{ title: "Une salle de classe historique", criteria: "5 sens • 300 mots" }]
      },
      // ... Les autres modules suivent la même structure
    ];

    function init() { renderHome(); }
    function renderHome() {
      document.getElementById('homeView').classList.add('active');
      document.getElementById('lessonView').classList.remove('active');
      const grid = document.getElementById('modulesGrid');
      grid.innerHTML = modules.map(m => `
        <div class="module-card" onclick="selectModule(${m.id})">
          <div class="module-icon">${m.icon}</div>
          <div class="module-number">${m.id}</div>
          <div class="module-title">${m.title}</div>
          <div class="module-desc">${m.description}</div>
        </div>
      `).join('');
    }

    function selectModule(id) {
      currentModule = modules.find(m => m.id === id);
      renderLesson();
    }

    function renderLesson() {
      document.getElementById('homeView').classList.remove('active');
      document.getElementById('lessonView').classList.add('active');
      const sidebarList = document.getElementById('sidebarNavList');
      const sections = [
        { id: 'observation', label: 'Observation', icon: '📖' },
        { id: 'boite-outils', label: 'Outils', icon: '🔧' },
        { id: 'redaction', label: 'Rédaction', icon: '✏️' }
      ];
      sidebarList.innerHTML = sections.map(sec => `
        <div class="sidebar-nav-item" onclick="showSection('${sec.id}')">
          <span>${sec.icon} ${sec.label}</span>
        </div>
      `).join('');
      showSection('observation');
    }

    function showSection(id) {
      const content = document.getElementById('lessonContent');
      if(id === 'observation') {
        content.innerHTML = `<div class="lesson-step"><h3>${currentModule.title}</h3><div class="concept-box">${currentModule.context}</div></div>`;
      } else if(id === 'redaction') {
        content.innerHTML = `<div class="lesson-step"><textarea placeholder="Écrivez ici..."></textarea></div>`;
      }
    }

    function goHome() { renderHome(); }
    function resetAll() { location.reload(); }
    init();
  </script>
</body>
</html>
