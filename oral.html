<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Activités QCM - La Boîte à Merveilles</title>
    <style>
        :root {
            --primary-dark: #2c3e50;
            --accent-color: #e67e22;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --info-color: #2980b9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color 0.8s ease;
            background-color: #f4f7f6;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 { text-align: center; color: var(--primary-dark); text-transform: uppercase; letter-spacing: 2px; }

        .nav-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .nav-btn {
            padding: 10px 14px;
            border: none;
            background: var(--primary-dark);
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-btn.active { background: var(--accent-color); transform: translateY(-3px); }

        .activity-card { display: none; }
        .activity-card.active { display: block; animation: fadeIn 0.5s ease; }

        .banner {
            background: #fff3e0;
            border-left: 6px solid var(--accent-color);
            padding: 15px;
            margin-bottom: 20px;
        }

        .expression-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            font-style: italic;
            color: #c0392b;
        }

        .dialogue-box {
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .speaker { font-weight: bold; color: var(--primary-dark); min-width: 140px; display: inline-block; }
        .highlight { background: #fff176; font-weight: bold; padding: 2px 4px; border-radius: 3px; }

        .quiz-section { background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #eee; }
        .q-item { margin-bottom: 25px; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .options-group { margin: 10px 0; }
        .option-label { display: block; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .option-label:hover { background: #f0f0f0; }
        
        .option-label input { margin-right: 10px; }

        .check-btn { 
            background: var(--primary-dark); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            margin-top: 10px;
            transition: 0.4s;
        }
        
        .feedback { 
            display: none; 
            margin-top: 12px; 
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid var(--info-color);
        }
        
        .correct-fb { background: #e8f5e9; border-left-color: var(--success-color); }
        .wrong-fb { background: #ffebee; border-left-color: var(--error-color); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>Atelier Interactif : La Boîte à Merveilles</h1>
    <div class="nav-bar" id="navigation"></div>

</div>

<script>
    const activities = [
        {
            theme: "La Solitude (Introduction)",
            bg: "#D5F5E3",
            exp: ["Sentiment de vacuité", "Évasion onirique", "Refuge de l'invisible", "Solitude contemplative"],
            dialogue: [
                ["Sidi Mohammed", "Maman, pourquoi le temps semble-t-il s'arrêter dans cette maison ?"],
                ["Lalla Zoubida", "C'est parce que tu ne joues pas assez avec les enfants de ton âge."],
                ["Sidi Mohammed", "Leur compagnie me donne un <span class='highlight'>sentiment de vacuité</span> insupportable."],
                ["Lalla Zoubida", "Tu préfères rester seul avec tes boutons et tes clous rouillés ?"],
                ["Sidi Mohammed", "Ce ne sont pas des objets, ce sont des amis pour mon <span class='highlight'>évasion onirique</span>."],
                ["Lalla Zoubida", "Tu finiras par devenir fou, mon pauvre enfant."],
                ["Sidi Mohammed", "Au contraire, je trouve la paix dans le <span class='highlight'>refuge de l'invisible</span>."],
                ["Lalla Zoubida", "L'invisible ne te donnera pas à manger plus tard."],
                ["Sidi Mohammed", "Il me donne la beauté que le Msid m'enlève."],
                ["Lalla Zoubida", "Le Fqih dit que tu es un élève distrait."],
                ["Sidi Mohammed", "Ma distraction est une <span class='highlight'>solitude contemplative</span> que personne ne comprend."],
                ["Lalla Zoubida", "Ton père aussi est silencieux, mais il travaille."],
                ["Sidi Mohammed", "Mon père écoute le silence, lui aussi."],
                ["Lalla Zoubida", "Il écoute les machines à tisser, pas les djinns !"],
                ["Sidi Mohammed", "Les djinns sont plus réels que les voisins."],
                ["Lalla Zoubida", "Tais-toi, tu vas attirer le mauvais œil !"],
                ["Sidi Mohammed", "Ma boîte me protège mieux que les amulettes."],
                ["Lalla Zoubida", "Viens manger et laisse tes rêves de côté."],
                ["Sidi Mohammed", "Je mangerai quand j'aurai fini de parler à mon prince de verre."],
                ["Lalla Zoubida", "Patience, Seigneur, patience avec cet enfant."]
            ],
            questions: [
                {q: "Pourquoi l'enfant refuse-t-il de jouer ?", opts: ["Il est trop fatigué", "Il ressent un vide avec les autres", "Il n'aime pas le ballon"], correct: 1},
                {q: "Que représente la boîte pour lui ?", opts: ["Un simple jouet", "Un objet de luxe", "Un refuge protecteur"], correct: 2},
                {q: "L'attitude de la mère est plutôt :", opts: ["Pragmatique et inquiète", "Poétique et douce", "Indifférente"], correct: 0},
                {q: "Que signifie 'onirique' ?", opts: ["Relatif au sommeil", "Relatif au rêve", "Relatif à la peur"], correct: 1},
                {q: "Quel registre domine ici ?", opts: ["Comique", "Lyrique", "Polémique"], correct: 1},
                {q: "Qui sont les 'amis' de l'enfant ?", opts: ["Les voisins", "Les objets de sa boîte", "Les élèves du Msid"], correct: 1},
                {q: "L'antithèse majeure ici est entre :", opts: ["Manger et dormir", "Invisible et réalité", "Père et mère"], correct: 1},
                {q: "Le père est décrit comme étant :", opts: ["Bavard", "Silencieux", "Sévère"], correct: 1},
                {q: "L'enfant préfère les djinns car :", opts: ["Ils font peur", "Ils sont plus réels que les voisins", "Ils donnent de l'argent"], correct: 1},
                {q: "La solitude de l'enfant est :", opts: ["Subie", "Contemplative et choisie", "Une punition"], correct: 1}
            ]
        },
        {
            theme: "Le Bain Maure (Le supplice)",
            bg: "#FADBD8",
            exp: ["Atmosphère infernale", "Supplice physique", "Répulsion instinctive", "Vapeurs suffocantes"],
            dialogue: [

                ["Sidi Mohammed", "Non maman, je t'en supplie, cet endroit est une <span class='highlight'>atmosphère infernale</span>."],
                ["Lalla Zoubida", "C'est la tradition, il faut être propre pour le vendredi."],
                ["Sidi Mohammed", "Pour moi, le frottement du 'kess' est un <span class='highlight'>supplice physique</span>."],
                ["Lalla Zoubida", "Toutes les femmes du quartier seront là pour discuter."],
                ["Sidi Mohammed", "C'est justement ce mélange de cris et de corps qui me cause une <span class='highlight'>répulsion instinctive</span>."],
                ["Lalla Zoubida", "L'eau chaude te fera du bien au moral."],
                ["Sidi Mohammed", "Je préfère mon moral bas à ces <span class='highlight'>vapeurs suffocantes</span>."],
                ["Lalla Zoubida", "Ne discute pas, prends tes vêtements de rechange."],
                ["Sidi Mohammed", "Même les djinns ne fréquenteraient pas un tel lieu."],
                ["Lalla Zoubida", "Au contraire, on dit que les djinns habitent les lieux d'eau."],
                ["Sidi Mohammed", "Alors pourquoi m'y emmener si c'est dangereux ?"],

                ["Sidi Mohammed", "Je fermerai les yeux pour ne rien voir."],
                ["Lalla Zoubida", "Tu es un petit homme maintenant, sois courageux."],
                ["Sidi Mohammed", "Un homme ne devrait pas pleurer pour un peu d'eau chaude."],
                ["Lalla Zoubida", "Exactement, alors marche plus vite."],
                ["Sidi Mohammed", "Je marche, mais mon cœur reste à la maison."]
            ],
            questions: [
                {q: "L'enfant compare le bain à :", opts: ["Un paradis", "L'enfer", "Une aire de jeux"], correct: 1},
                {q: "Le bain est obligatoire pour :", opts: ["Le mariage", "La fête d'Achoura", "La propreté du vendredi"], correct: 2},
                {q: "Qu'est-ce que le 'kess' ?", opts: ["Un savon", "Un gant de gommage", "Un seau d'eau"], correct: 1},
                {q: "Le sentiment de l'enfant est une :", opts: ["Répulsion instinctive", "Attirance forte", "Indifférence totale"], correct: 0},
                {q: "Que font les femmes au bain ?", opts: ["Elles dorment", "Elles travaillent", "Elles discutent"], correct: 2},
                {q: "Comment est l'air au bain ?", opts: ["Frais et pur", "Parfumé", "Suffocant"], correct: 2},
                {q: "Selon la mère, qui habite les lieux d'eau ?", opts: ["Les djinns", "Les poissons", "Les anges"], correct: 0},
                {q: "L'enfant ferme les yeux pour :", opts: ["S'endormir", "Ne rien voir de la foule", "Mieux entendre"], correct: 1},
                {q: "Le ton de cette scène est :", opts: ["Tragique", "Pathétique et comique", "Religieux"], correct: 1},
                {q: "Le 'cœur' de l'enfant reste :", opts: ["Au bain", "À la maison", "Au Msid"], correct: 1}
            ]
        },
        {
            theme: "La Dispute de Rahma",
            bg: "#EAECEE",
            exp: ["Invectives acerbes", "Dignité bafouée", "Rupture du voisinage", "Tempête verbale"],
            dialogue: [
                ["Rahma", "C'est mon tour de lessive aujourd'hui, Zoubida !"],

                ["Lalla Zoubida", "Tes <span class='highlight'>invectives acerbes</span> ne m'impressionnent pas, femme !"],
                ["Rahma", "Regardez cette noble dame qui se croit au-dessus de nous !"],
                ["Lalla Zoubida", "Je sens ma <span class='highlight'>dignité bafouée</span> par une personne de ton espèce."],
                ["Rahma", "Mon espèce vaut bien la tienne, descendante du prophète !"],
                ["Lalla Zoubida", "C'est une <span class='highlight'>rupture du voisinage</span> définitive entre nous."],
                ["Rahma", "Tant mieux, je n'ai que faire de tes airs de sainte."],
                ["Lalla Zoubida", "Cette <span class='highlight'>tempête verbale</span> va réveiller toute la maison."],
                ["Rahma", "Que tout le monde sache qui tu es vraiment !"],
                ["Lalla Zoubida", "Je ne t'adresserai plus jamais la parole."],
                ["Rahma", "Tes silences sont mes plus beaux cadeaux."],
                ["Lalla Zoubida", "Maudite soit l'heure où je t'ai connue."],
                ["Rahma", "Maudis-toi toi-même, sorcière de malheur !"],
                ["Lalla Zoubida", "Sidi Mohammed, ne regarde pas cette femme impolie."],
                ["Rahma", "L'enfant voit bien qui a raison ici."],
                ["Lalla Zoubida", "L'enfant voit une furie qui hurle pour un peu d'eau."],
                ["Rahma", "Sors de mon chemin immédiatement !"],
                ["Lalla Zoubida", "Je sors, mais Dieu jugera nos actes."]
            ],
            questions: [
                {q: "L'origine de la dispute est :", opts: ["Un vol d'argent", "Le tour de lessive", "Une insulte sur l'enfant"], correct: 1},
                {q: "Rahma traite Zoubida de :", opts: ["Menteuse", "Amie", "Sœur"], correct: 0},
                {q: "Zoubida invoque son origine :", opts: ["Royale", "Descendante du prophète", "Andalouse"], correct: 1},
                {q: "Le dialogue est marqué par des :", opts: ["Compliments", "Invectives acerbes", "Prières"], correct: 1},
                {q: "La dispute cause une :", opts: ["Réconciliation", "Fête", "Rupture du voisinage"], correct: 2},
                {q: "Que signifie 'acerbe' ?", opts: ["Doux", "Agressif et blessant", "Incompréhensible"], correct: 1},
                {q: "L'enfant, face à cette violence :", opts: ["Rit", "Est traumatisé (pleure)", "Dort"], correct: 1},
                {q: "Zoubida appelle Rahma :", opts: ["Une furie", "Une sainte", "Une reine"], correct: 0},
                {q: "La fin du dialogue évoque :", opts: ["La police", "Le jugement de Dieu", "Le départ du mari"], correct: 1},
                {q: "Le lieu de la dispute est :", opts: ["Le patio (cour commune)", "Le toit", "La rue"], correct: 0}
            ]
        },
        {
            theme: "Le Msid et le Fqih",
            bg: "#FEF9E7",
            exp: ["Autorité implacable", "Apprentissage psalmodié", "Crainte révérencielle", "Rigueur dogmatique"],
            dialogue: [
                ["Le Fqih", "Sidi Mohammed, récite le verset d'hier sans erreur."],

                ["Le Fqih", "Seul l' <span class='highlight'>apprentissage psalmodié</span> restera dans ta mémoire stérile."],

                ["Sidi Mohammed", "Est-ce que le savoir doit toujours faire mal ?"],
                ["Le Fqih", "La douleur est la forge de l'âme, petit sot."],
                ["Sidi Mohammed", "Je préférerais apprendre avec des fleurs."],
                ["Le Fqih", "Les fleurs fanent, la parole de Dieu est éternelle."],
                ["Sidi Mohammed", "Je vais essayer de me concentrer davantage."],
                ["Le Fqih", "Recommence depuis le début, et que ta voix porte."],
                ["Sidi Mohammed", "Bismillahi Rahmani Rahimi..."],
                ["Le Fqih", "C'est mieux, mais la route est encore longue."],
                ["Sidi Mohammed", "Longue comme l'éternité du mardi."]
            ],
            questions: [
                {q: "L'instrument de punition du Fqih est :", opts: ["Une règle", "Une baguette de cognassier", "Un martinet"], correct: 1},
                {q: "L'apprentissage au Msid est fondé sur :", opts: ["Le jeu", "La psalmodie (par cœur)", "Le dessin"], correct: 1},
                {q: "Le sentiment de l'enfant envers le maître est :", opts: ["L'amour", "La crainte révérencielle", "La camaraderie"], correct: 1},
                {q: "Le Fqih compare le soleil à :", opts: ["Un cadeau de Dieu", "Une distraction pour les bêtes", "Une source de savoir"], correct: 1},
                {q: "L'objet utilisé pour écrire est :", opts: ["Un cahier", "Une planchette de bois", "Une ardoise magique"], correct: 1},
                {q: "Pour le Fqih, la douleur est :", opts: ["Inutile", "La forge de l'âme", "Un péché"], correct: 1},
                {q: "Le jour le plus redouté au Msid est :", opts: ["Le vendredi", "Le mardi", "Le dimanche"], correct: 1},
                {q: "L'enfant rêve d'apprendre avec :", opts: ["Des fleurs", "Des ordinateurs", "Des djinns"], correct: 0},
                {q: "L'autorité du Fqih est qualifiée d' :", opts: ["Inexistante", "Implacable", "Douce"], correct: 1},

                {q: "Le père confie la garde de la maison à :", opts: ["Sidi Mohammed", "Le Fqih", "Driss le teigneux"], correct: 0},

        {

            ],
            questions: [
                {q: "Quelle est la trahison de Moulay Larbi ?", opts: ["Il a volé Aïcha", "Il a pris une seconde épouse", "Il a quitté la ville"], correct: 1},

    const nav = document.getElementById('navigation');
    const content = document.getElementById('content-area');

    function loadActivity(index, btn) {
        document.body.style.backgroundColor = activities[index].bg;
        document.querySelectorAll('.activity-card').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`card-${index}`).classList.add('active');
        if(btn) btn.classList.add('active');
    }

    activities.forEach((act, i) => {
        const btn = document.createElement('button');
        btn.className = `nav-btn ${i === 0 ? 'active' : ''}`;
        btn.innerText = `Activité ${i + 1}`;
        btn.onclick = () => loadActivity(i, btn);
        nav.appendChild(btn);

        const card = document.createElement('div');
        card.id = `card-${i}`;
        card.className = `activity-card ${i === 0 ? 'active' : ''}`;
        
        card.innerHTML = `
            <div class="banner">
                <h3>Thème : ${act.theme}</h3>
                <div class="expression-list">
                    ${act.exp.map(e => `<span>• ${e}</span>`).join('')}
                </div>
            </div>
            <div class="dialogue-box">
                ${act.dialogue.map(line => `<p><span class="speaker">${line[0]} :</span> ${line[1]}</p>`).join('')}
            </div>
            <div class="quiz-section">
                <h4>QCM d'Analyse Interactive</h4>
                ${act.questions.map((qObj, qi) => `
                    <div class="q-item" id="qbox-${i}-${qi}">
                        <p><strong>${qi+1}. ${qObj.q}</strong></p>
                        <div class="options-group">
                            ${qObj.opts.map((opt, oi) => `
                                <label class="option-label">
                                    <input type="radio" name="q-${i}-${qi}" value="${oi}">
                                    ${opt}
                                </label>
                            `).join('')}
                        </div>
                        <button class="check-btn" onclick="checkQCM(${i}, ${qi})">Valider</button>
                        <div class="feedback" id="fb-${i}-${qi}"></div>
                    </div>
                `).join('')}
            </div>
        `;
        content.appendChild(card);
    });

    window.checkQCM = function(actIdx, qIdx) {
        const qBox = document.getElementById(`qbox-${actIdx}-${qIdx}`);
        const fb = document.getElementById(`fb-${actIdx}-${qIdx}`);
        const btn = qBox.querySelector('.check-btn');
        const selected = qBox.querySelector(`input[name="q-${actIdx}-${qIdx}"]:checked`);

        if (!selected) {
            alert("Sélectionnez une option !");
            return;
        }

        const userVal = parseInt(selected.value);
        const correctVal = activities[actIdx].questions[qIdx].correct;

        fb.style.display = 'block';
        if (userVal === correctVal) {
            btn.style.backgroundColor = '#27ae60';
            btn.innerText = "Correct !";
            fb.className = "feedback correct-fb";
            fb.innerHTML = "<strong>Bravo !</strong> C'est la bonne analyse.";
        } else {
            btn.style.backgroundColor = '#e74c3c';
            btn.innerText = "Incorrect";
            fb.className = "feedback wrong-fb";
            fb.innerHTML = "<strong>Erreur.</strong> Réessayez ou vérifiez le texte du dialogue.";
        }
    };

    document.body.style.backgroundColor = activities[0].bg;
</script>
