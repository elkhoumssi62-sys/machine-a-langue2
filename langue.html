<!doctype html>
<html lang="fr">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine à Langue - Encyclopédie Linguistique</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&amp;family=Poppins:wght@400;600;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #1877f2;
            --accent: #ffc107;
            --success: #10b981;
            --danger: #f87171;
            --bg: linear-gradient(135deg, #0b1120 0%, #1a1f3a 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
        }

        html { height: 100%; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg);
            color: var(--text-primary); 
            height: 100%;
            overflow-x: hidden;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(11, 17, 32, 0.95);
            padding: 15px 25px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .navbar-brand {
            font-weight: 900;
            color: var(--accent);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-score {
            background: rgba(24, 119, 242, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-value {
            color: var(--accent);
            font-size: 1.1rem;
        }

        .navbar-download {
            background: linear-gradient(135deg, var(--accent), #ffb700);
            border: none;
            color: #1a1a1a;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .navbar-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }

        .navbar-download:active {
            transform: translateY(0);
        }

        /* MAIN CONTAINER */
        .main-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, rgba(24, 119, 242, 0.1) 0%, rgba(255, 193, 7, 0.05) 100%);
            border-radius: 16px;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        /* MODULES GRID */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* CATEGORY FILTERS */
        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .category-btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 193, 7, 0.1);
        }

        .category-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-color: var(--accent);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }

        .module-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .module-card:hover::before {
            left: 100%;
        }

        .module-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 193, 7, 0.1);
        }

        .module-number {
            display: inline-block;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .module-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .module-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .module-status {
            margin-top: 15px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            color: var(--success);
            font-weight: 600;
        }

        /* LESSON VIEW */
        .lesson-view {
            display: none;
        }

        .lesson-view.active {
            display: block;
        }

        .lesson-header {
            background: linear-gradient(135deg, rgba(24, 119, 242, 0.2) 0%, rgba(255, 193, 7, 0.1) 100%);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .lesson-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .lesson-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .btn-back {
            background: rgba(24, 119, 242, 0.2);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: var(--primary);
            color: white;
        }

        /* STEPS */
        .lesson-step {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .step-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .step-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border-radius: 10px;
            background: rgba(255, 193, 7, 0.1);
        }

        /* Couleurs distinctives par module - Titres des étapes */
        /* ANALOGIE - Modules 1 & 4 */
        .module-1 .step-title, .module-4 .step-title { 
            background: rgba(239, 68, 68, 0.2); 
            border-left: 6px solid #ef4444; 
            color: #fca5a5; 
        }
        
        /* OPPOSITION - Modules 2, 3, 8, 10 */
        .module-2 .step-title, .module-3 .step-title, .module-8 .step-title, .module-10 .step-title { 
            background: rgba(59, 130, 246, 0.2); 
            border-left: 6px solid #3b82f6; 
            color: #93c5fd; 
        }
        
        /* SUBSTITUTION - Module 5 */
        .module-5 .step-title { 
            background: rgba(34, 197, 94, 0.2); 
            border-left: 6px solid #22c55e; 
            color: #86efac; 
        }
        
        /* EXAGÉRATION - Module 9 */
        .module-9 .step-title { 
            background: rgba(168, 85, 247, 0.2); 
            border-left: 6px solid #a855f7; 
            color: #d8b4fe; 
        }
        
        /* INSISTANCE - Modules 6 & 7 */
        .module-6 .step-title, .module-7 .step-title { 
            background: rgba(249, 115, 22, 0.2); 
            border-left: 6px solid #f97316; 
            color: #fed7aa; 
        }

        /* SUBFIGURES PREVIEW BAR */
        .subfigures-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 193, 7, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 193, 7, 0.2);
        }

        .subfigure-preview-card {
            padding: 15px;
            border-radius: 8px;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .subfigure-preview-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .subfigure-preview-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .subfigure-preview-desc {
            font-size: 0.75rem;
            opacity: 0.8;
            line-height: 1.4;
        }

        /* Couleurs pour chaque type */
        .subfigure-card-1 { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .subfigure-card-1 .subfigure-preview-title { color: #fca5a5; }
        .subfigure-card-1 .subfigure-preview-desc { color: rgba(252, 165, 165, 0.8); }

        .subfigure-card-2 { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .subfigure-card-2 .subfigure-preview-title { color: #93c5fd; }
        .subfigure-card-2 .subfigure-preview-desc { color: rgba(147, 197, 253, 0.8); }

        .subfigure-card-3 { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .subfigure-card-3 .subfigure-preview-title { color: #86efac; }
        .subfigure-card-3 .subfigure-preview-desc { color: rgba(134, 239, 172, 0.8); }

        .subfigure-card-4 { border-color: #f97316; background: rgba(249, 115, 22, 0.1); }
        .subfigure-card-4 .subfigure-preview-title { color: #fed7aa; }
        .subfigure-card-4 .subfigure-preview-desc { color: rgba(254, 215, 170, 0.8); }

        .subfigure-card-5 { border-color: #a855f7; background: rgba(168, 85, 247, 0.1); }
        .subfigure-card-5 .subfigure-preview-title { color: #d8b4fe; }
        .subfigure-card-5 .subfigure-preview-desc { color: rgba(216, 180, 254, 0.8); }

        .subfigure-card-6 { border-color: #06b6d4; background: rgba(6, 182, 212, 0.1); }
        .subfigure-card-6 .subfigure-preview-title { color: #67e8f9; }
        .subfigure-card-6 .subfigure-preview-desc { color: rgba(103, 232, 249, 0.8); }

        .subfigure-card-7 { border-color: #ec4899; background: rgba(236, 72, 153, 0.1); }
        .subfigure-card-7 .subfigure-preview-title { color: #f472b6; }
        .subfigure-card-7 .subfigure-preview-desc { color: rgba(244, 114, 182, 0.8); }

        .subfigure-card-8 { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }
        .subfigure-card-8 .subfigure-preview-title { color: #c4b5fd; }
        .subfigure-card-8 .subfigure-preview-desc { color: rgba(196, 181, 253, 0.8); }

        .subfigure-card-9 { border-color: #14b8a6; background: rgba(20, 184, 166, 0.1); }
        .subfigure-card-9 .subfigure-preview-title { color: #7ee8d9; }
        .subfigure-card-9 .subfigure-preview-desc { color: rgba(126, 232, 217, 0.8); }

        .subfigure-card-10 { border-color: #d97706; background: rgba(217, 119, 6, 0.1); }
        .subfigure-card-10 .subfigure-preview-title { color: #fcd34d; }
        .subfigure-card-10 .subfigure-preview-desc { color: rgba(252, 211, 77, 0.8); }

        .corpus-list {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            margin-bottom: 20px;
        }

        .corpus-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border: 1px solid rgba(24, 119, 242, 0.3);
            font-style: italic;
            line-height: 1.6;
        }

        .corpus-item:last-child {
            margin-bottom: 0;
        }

        .corpus-item strong {
            color: var(--accent);
            font-style: normal;
        }

        /* QUESTIONS */
        .question-block {
            background: rgba(24, 119, 242, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(24, 119, 242, 0.3);
        }

        .question-text {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .question-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid var(--border);
            color: white;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(24, 119, 242, 0.3);
        }

        input[type="text"].correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        input[type="text"].wrong {
            border-color: var(--danger);
            background: rgba(248, 113, 113, 0.1);
        }

        .btn-check {
            background: linear-gradient(135deg, var(--primary), rgba(24, 119, 242, 0.8));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.4);
        }

        .btn-check:active {
            transform: translateY(0);
        }

        .feedback {
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: 600;
            display: inline-block;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.wrong {
            color: var(--danger);
        }

        /* CONCEPT BOX */
        .concept-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(24, 119, 242, 0.1) 100%);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid rgba(16, 185, 129, 0.3);
            line-height: 1.8;
            font-size: 1rem;
        }

        .concept-box strong {
            color: var(--accent);
        }

        /* EXERCISES GRID */
        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .exercise-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .exercise-box:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
        }

        .exercise-title {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exercise-list {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.7;
        }

        .exercise-list li {
            margin-bottom: 8px;
            list-style-position: inside;
        }

        .exercise-input-group {
            display: flex;
            gap: 8px;
        }

        .exercise-input-group input {
            flex: 1;
        }

        .exercise-input-group button {
            flex-shrink: 0;
        }

        /* STATS */
        .lesson-stats {
            background: linear-gradient(135deg, rgba(24, 119, 242, 0.1) 0%, rgba(255, 193, 7, 0.05) 100%);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 30px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            background: rgba(24, 119, 242, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .stat-content h3 {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: 900;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.98) 0%,
                rgba(255, 255, 255, 0.95) 100%);
            border: 3px solid #d1d5db;
            border-radius: 0;
            padding: 40px 40px 40px 90px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease;
            position: relative;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 70px;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.12) 0%, rgba(239, 68, 68, 0.05) 100%);
            border-right: 2px solid rgba(239, 68, 68, 0.4);
        }

        .modal-content::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 27px,
                rgba(100, 150, 255, 0.1) 27px,
                rgba(100, 150, 255, 0.1) 28px
            );
            pointer-events: none;
            z-index: 1;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ffc107;
            position: relative;
            z-index: 2;
        }

        .modal-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #1f2937;
            margin: 0;
            text-decoration: underline;
            text-decoration-color: #ffc107;
            text-decoration-thickness: 3px;
            text-underline-offset: 6px;
        }

        .modal-close {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444;
            color: #ef4444;
            width: 40px;
            height: 40px;
            border-radius: 0;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            font-weight: bold;
        }

        .modal-close:hover {
            background: #ef4444;
            color: white;
        }

        /* NOTEBOOK STYLE - ONLY FOR MODAL */
        #subfiguresContent {
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.95) 0%,

        function selectQCM(questionId, selectedIdx, correctIdx, feedbackId, activityId) {
            const feedback = document.getElementById(feedbackId);
            const allOptions = document.querySelectorAll(`[id^="${questionId}-"]`);
            
            allOptions.forEach(opt => opt.style.opacity = '0.5');
            document.getElementById(`${questionId}-${selectedIdx}`).style.opacity = '1';

            if (selectedIdx === correctIdx) {
                feedback.innerHTML = '<i class="fas fa-check-circle"></i> ✓ Correct !';
                feedback.className = 'feedback correct';
                document.getElementById(`${questionId}-${selectedIdx}`).style.borderColor = 'var(--success)';
                document.getElementById(`${questionId}-${selectedIdx}`).style.background = 'rgba(16, 185, 129, 0.1)';
                addPoints(1);
                updateOralScore();
            } else {
                feedback.innerHTML = `<i class="fas fa-times-circle"></i> ✗ Mauvaise réponse. Bonne réponse : option ${correctIdx + 1}`;
                feedback.className = 'feedback wrong';
                document.getElementById(`${questionId}-${selectedIdx}`).style.borderColor = 'var(--danger)';
                document.getElementById(`${questionId}-${selectedIdx}`).style.background = 'rgba(248, 113, 113, 0.1)';
                document.getElementById(`${questionId}-${correctIdx}`).style.borderColor = 'var(--success)';
                document.getElementById(`${questionId}-${correctIdx}`).style.background = 'rgba(16, 185, 129, 0.1)';

            allOptions.forEach(opt => opt.disabled = true);
        }

        function checkAnswer(id, expected, feedbackId) {
            const value = document.getElementById(id).value.toLowerCase().trim();
            const feedback = document.getElementById(feedbackId);
            const input = document.getElementById(id);

            // Normalize expected answer(s)
            let expectedArray = Array.isArray(expected) ? expected : [expected];
            expectedArray = expectedArray.map(e => e.toLowerCase().trim());

            // STRICT CHECK: Match exactly or contains key word (but not loose matching)
            const isCorrect = expectedArray.some(exp => {
                // Exact match
                if (value === exp) return true;
                // Check if user answer is at least 70% accurate
                if (exp.length > 5 && value.length > 2) {
                    const words = exp.split(' ');
                    const matchedWords = words.filter(word => value.includes(word.slice(0, -1)) || value.includes(word));
                    return matchedWords.length >= Math.ceil(words.length * 0.6);
                }
                return false;
            });

            if (isCorrect) {
                feedback.innerHTML = '<i class="fas fa-check-circle"></i> ✓ Correct !';
                feedback.className = 'feedback correct';
                input.classList.add('correct');
                input.disabled = true;
                addPoints(5);
            } else {
                feedback.innerHTML = `<i class="fas fa-times-circle"></i> ✗ Attendu : <strong>${expectedArray.join(' / ')}</strong>`;
                feedback.className = 'feedback wrong';
                input.classList.add('wrong');
            }
        }

        function checkExercise(id, expected, feedbackId, moduleId) {
            const value = document.getElementById(id).value.toLowerCase().trim();

            if (value === expected.toLowerCase()) {

                setTimeout(() => {

                }, 500);
            } else {
                feedback.innerHTML = `<i class="fas fa-times-circle"></i> ✗ Réponse : <strong>${expected}</strong>`;
                feedback.className = 'feedback wrong';
                input.classList.add('wrong');
            }
        }

        function checkExercisePhrase(id, expected, feedbackId, moduleId) {
