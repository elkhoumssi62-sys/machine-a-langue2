<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Interactive Complète - Prof. Mohamed EL KHOUMSSI</title>
    <style>
        :root {
            --primary-blue: #2c3e50;
            --accent-gold: #c0a080;
            --white: #ffffff;
            --success: #27ae60;
            --error: #e74c3c;
            --synth-red: #c0392b;
            --question-color: #2980b9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.6s ease;
        }

        /* --- NAVIGATION --- */
        #sidebar {
            width: 320px;
            background: var(--primary-blue);
            color: var(--white);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            background: rgba(0,0,0,0.2);
        }

        .nav-menu {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .nav-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }

        .nav-item:hover { background: rgba(255,255,255,0.15); }
        .nav-item.active { background: var(--accent-gold); font-weight: bold; }

        /* --- CONTENU --- */
        #main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .text-support {
            font-family: 'Georgia', serif;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #222;
            text-align: justify;
            border-left: 8px solid var(--accent-gold);
            padding-left: 20px;
            white-space: pre-line;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .question-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .question-title {
            color: var(--question-color);
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .opt-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
        }

        .opt-btn.correct { background: var(--success) !important; color: white; }
        .opt-btn.wrong { background: var(--error) !important; color: white; }

        #synthesis-box {
            margin-top: 30px;
            padding: 20px;
            background: #fff5f5;
            border: 2px solid var(--synth-red);
            border-radius: 10px;
            display: none;
            color: var(--synth-red);
        }
    </style>
</head>

        const menu = document.getElementById('menu');
        const viewTitle = document.getElementById('title');
        const viewText = document.getElementById('text');
        const viewQuiz = document.getElementById('quiz');
        const viewSynthBox = document.getElementById('synthesis-box');
        const viewSynthText = document.getElementById('synth-text');

        function init() {
            database.forEach(item => {
                const d = document.createElement('div');
                d.className = 'nav-item';
                d.innerText = item.titre;
                d.onclick = () => load(item.id, d);
                menu.appendChild(d);
            });
        }

        function load(id, el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            const data = database.find(d => d.id === id);
            document.body.style.backgroundColor = data.color;
            viewTitle.innerText = data.titre;
            viewText.innerText = data.texte;
            viewSynthBox.style.display = 'none';
            viewQuiz.innerHTML = '';
            let count = 0;

            data.questions.forEach((q, i) => {
                const box = document.createElement('div');
                box.className = 'question-box';
                box.innerHTML = `<span class="question-title">${i+1}. ${q.q}</span>`;
                q.o.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        const all = box.querySelectorAll('button');
                        all.forEach(b => b.style.pointerEvents = 'none');
                        if(idx === q.c) btn.classList.add('correct');
                        else { btn.classList.add('wrong'); all[q.c].classList.add('correct'); }
                        count++;
                        if(count === 10) {
                            viewSynthBox.style.display = 'block';
                            viewSynthText.innerText = data.synth;
                        }
                    };
                    box.appendChild(btn);
                });
                viewQuiz.appendChild(box);
            });
        }
        window.onload = init;
    </script>
